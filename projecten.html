<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Projectenoverzicht van mijn persoonlijke portfoliosite."
    >
    <title>Projecten | Portfolio</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="assets/js/projecten.js" defer></script>
  </head>

  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Naar de whoami-pagina">
        <img
          src="assets/img/portfolio-mark.svg"
          alt="Portfolio monogram"
          width="44"
          height="44"
        >
        <span>Mijn Portfolio</span>
      </a>

      <nav class="site-nav" aria-label="Hoofdnavigatie">
        <ul>
          <li><a href="index.html">Whoami</a></li>
          <li><a href="projecten.html" aria-current="page">Projecten</a>
          <li><a href="blog.html">Blog</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="page-heading" aria-labelledby="projects-title">
        <p class="eyebrow">Projecten</p>
        <h1 id="projects-title">Projecten die ik heb gemaakt</h1>
        <p>
          Hieronder staan mijn school- en hobbyprojecten. Je kunt de projecten
          filteren en sorteren.
        </p>
      </section>

      <section class="project-controls" aria-labelledby="filter-title">
        <div>
          <h2 id="filter-title">Projecten filteren</h2>

          <label for="category-filter">Categorie</label>
          <select id="category-filter">
            <option value="alle">Alle categorieën</option>
            <option value="web">Webontwikkeling</option>
            <option value="data">Data engineering</option>
            <option value="java">Java</option>
          </select>
        </div>

        <div>
          <label for="sort-projects">Sorteer op</label>
          <select id="sort-projects">
            <option value="az">Naam: A tot Z</option>
            <option value="za">Naam: Z tot A</option>
          </select>
        </div>
      </section>

      <p id="project-count" aria-live="polite"></p>

      <section
        id="project-list"
        class="card-grid"
        aria-label="Projectkaarten"
      ></section>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Mijn gemaakte projecten</p>
    </footer>
  </body>
</html>
